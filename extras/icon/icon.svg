<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="One Infinite Loop">
  <!-- The plasma of the hero on tharp.science/one-infinite-loop: its rainbow,
       its six lights at their resting places, the veil as it is behind the
       mark (about 38% page white), and the mark in the hero's slate. -->
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df2848"/>
      <stop offset="0.20" stop-color="#ef7926"/>
      <stop offset="0.40" stop-color="#efc53a"/>
      <stop offset="0.60" stop-color="#24a36a"/>
      <stop offset="0.82" stop-color="#284dbc"/>
      <stop offset="1" stop-color="#7939b5"/>
    </linearGradient>
    <radialGradient id="red">
      <stop offset="0" stop-color="#df2848"/>
      <stop offset="0.55" stop-color="#df2848" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#df2848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange">
      <stop offset="0" stop-color="#ef7926"/>
      <stop offset="0.55" stop-color="#ef7926" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ef7926" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellow">
      <stop offset="0" stop-color="#efc53a"/>
      <stop offset="0.55" stop-color="#efc53a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#efc53a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green">
      <stop offset="0" stop-color="#24a36a"/>
      <stop offset="0.55" stop-color="#24a36a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#24a36a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue">
      <stop offset="0" stop-color="#284dbc"/>
      <stop offset="0.55" stop-color="#284dbc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#284dbc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple">
      <stop offset="0" stop-color="#7939b5"/>
      <stop offset="0.55" stop-color="#7939b5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7939b5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#rainbow)"/>
  <circle cx="133" cy="184" r="328" fill="url(#red)"/>
  <circle cx="328" cy="717" r="328" fill="url(#orange)"/>
  <circle cx="481" cy="358" r="328" fill="url(#yellow)"/>
  <circle cx="686" cy="666" r="328" fill="url(#green)"/>
  <circle cx="942" cy="307" r="328" fill="url(#blue)"/>
  <circle cx="973" cy="911" r="328" fill="url(#purple)"/>
  <rect width="1024" height="1024" fill="#f7f8fa" fill-opacity="0.38"/>
